services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker-files/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEYS=${LLM_API_KEYS:-key_1,key_2}
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-2.0-flash}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - ENABLE_FAILURE_SIMULATION=${ENABLE_FAILURE_SIMULATION:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - DATABASE_URL=sqlite:////data/app.db
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-65536}
    volumes:
      - db-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker-files/frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
